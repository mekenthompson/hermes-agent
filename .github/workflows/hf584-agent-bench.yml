name: HF-584 Agent Docker benchmark

# Throwaway benchmark branch only. Never merged. Each variant reads and writes
# its own isolated GHA cache scope on this branch, so it never touches the
# release scope fork-agent-amd64 and never reaches GHCR.
on:
  push:
    branches: ['bench/hf584-agent-docker']

permissions:
  contents: read

concurrency:
  group: hf584-agent-bench
  cancel-in-progress: false

jobs:
  bench:
    name: bench (${{ matrix.variant }})
    if: github.repository == 'mekenthompson/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: max
            cache_to: type=gha,mode=max,scope=hf584-bench-max-v2,ignore-error=true
            cache_from: type=gha,scope=hf584-bench-max-v2
            outputs: type=docker
          - variant: min
            cache_to: type=gha,mode=min,scope=hf584-bench-min-v2,ignore-error=true
            cache_from: type=gha,scope=hf584-bench-min-v2
            outputs: type=docker
    env:
      TEST_IMAGE: hf584-bench:${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Write exact source install stamp
        run: >-
          python3 scripts/write_install_stamp.py --output install-stamp.json
          --commit "$GITHUB_SHA" --distribution docker --source ci
          --update-mechanism external

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Clock start
        run: date +%s > build-start

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          outputs: ${{ matrix.outputs }}
          push: false
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
            HERMES_IMAGE_IDENTITY=ghcr.io/mekenthompson/hermes-agent
          cache-from: ${{ matrix.cache_from }}
          cache-to: ${{ matrix.cache_to }}

      - name: Clock stop and verify loaded image
        run: |
          set -euo pipefail
          echo "build_wall_seconds=$(( $(date +%s) - $(cat build-start) ))"
          docker image inspect --format '{{.Id}} {{.Size}}' "$TEST_IMAGE"
          docker run --rm --entrypoint hermes "$TEST_IMAGE" --version
          docker run --rm --entrypoint python3 "$TEST_IMAGE" -c '
          import json, os, pathlib
          stamp = json.loads(pathlib.Path("/opt/hermes/install-stamp.json").read_text())
          assert stamp["commit"] == os.environ.get("GITHUB_SHA", stamp["commit"]), stamp
          print("stamp ok", stamp["commit"])
          '
