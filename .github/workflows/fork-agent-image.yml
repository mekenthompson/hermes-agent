name: Fork Agent Image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact selected main commit to GHCR
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: fork-agent-image-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: ghcr.io/mekenthompson/hermes-agent
  TEST_IMAGE: ghcr.io/mekenthompson/hermes-agent:sha-${{ github.sha }}

jobs:
  preflight:
    if: github.repository == 'mekenthompson/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build complete Agent image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
            HERMES_IMAGE_IDENTITY=${{ env.IMAGE_REPOSITORY }}
          cache-from: type=gha,scope=fork-agent-amd64
          cache-to: type=gha,mode=max,scope=fork-agent-amd64

      - name: Verify baked revision and runtime command
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_IMAGE_IDENTITY: ${{ env.IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          docker run --rm --env EXPECTED_REVISION --env EXPECTED_IMAGE_IDENTITY --entrypoint python3 "$TEST_IMAGE" -c '
          import importlib.metadata as metadata
          import json, os, pathlib
          marker = pathlib.Path("/etc/hermes/image-provenance.json")
          data = json.loads(marker.read_text(encoding="utf-8"))
          assert data["revision"] == os.environ["EXPECTED_REVISION"], data
          assert data["image"] == os.environ["EXPECTED_IMAGE_IDENTITY"], data
          assert data["version"] == metadata.version("hermes-agent"), data
          '
          docker run --rm --entrypoint hermes "$TEST_IMAGE" --version

      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.TEST_IMAGE }}
          format: spdx-json
          output-file: agent-image.spdx.json
          upload-artifact: false

      - name: Create bounded package SBOM for attestation
        run: |
          set -euo pipefail
          python3 scripts/compact-spdx-sbom.py \
            --input agent-image.spdx.json \
            --output agent-image.attestation.spdx.json \
            --max-bytes 16777216

      - name: Scan critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: json
          output: trivy-image.json
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Save exact scanned candidate
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.publish == 'true' &&
          github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker save "$TEST_IMAGE" | gzip -1 > agent-image.tar.gz

      - name: Upload exact scanned candidate
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.publish == 'true' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-agent-image-candidate-${{ github.sha }}
          path: |
            agent-image.tar.gz
            agent-image.spdx.json
            agent-image.attestation.spdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload pre-publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-agent-image-evidence-${{ github.sha }}
          path: |
            agent-image.spdx.json
            agent-image.attestation.spdx.json
            trivy-image.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: preflight
    if: >-
      github.repository == 'mekenthompson/hermes-agent' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: agent-image-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download exact scanned candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fork-agent-image-candidate-${{ github.sha }}

      - name: Load and verify exact scanned candidate
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_IMAGE_IDENTITY: ${{ env.IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          gzip -dc agent-image.tar.gz | docker load
          docker run --rm --env EXPECTED_REVISION --env EXPECTED_IMAGE_IDENTITY --entrypoint python3 "$TEST_IMAGE" -c '
          import importlib.metadata as metadata
          import json, os, pathlib
          data = json.loads(pathlib.Path("/etc/hermes/image-provenance.json").read_text(encoding="utf-8"))
          assert data["revision"] == os.environ["EXPECTED_REVISION"], data
          assert data["image"] == os.environ["EXPECTED_IMAGE_IDENTITY"], data
          assert data["version"] == metadata.version("hermes-agent"), data
          '

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push exact scanned candidate
        id: publish
        run: |
          set -euo pipefail
          docker push "$TEST_IMAGE"
          immutable_ref=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$TEST_IMAGE")
          digest=${immutable_ref#*@}
          python3 scripts/emit-image-manifest.py \
            --repository "$IMAGE_REPOSITORY" \
            --revision "${{ github.sha }}" \
            --digest "$digest" \
            --output agent-image-manifest.json
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest published digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest published SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: agent-image.attestation.spdx.json
          push-to-registry: true

      - name: Upload Fleet handoff manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-image-manifest-${{ github.sha }}
          path: agent-image-manifest.json
          if-no-files-found: error
          retention-days: 90
